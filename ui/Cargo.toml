[package]
name = "event_camera_editor_ui"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = { version="1.18.1", features=["unstable-wgpu-30", "renderer-femtovg-wgpu"] }
wgpu = { version = "30.0.1", features = ["wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true
